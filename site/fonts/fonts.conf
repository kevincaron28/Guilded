<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The bot's own font configuration (20 Nov 2026). The Oracle VM has no system fontconfig, so libvips logged
     "Fontconfig error: Cannot load default config file" on every card. Cards pass their font files explicitly
     (score-card.ts, card-kit.ts); this file only gives fontconfig a valid config that knows these same fonts.
     src/memory-limits.ts points FONTCONFIG_FILE here at startup unless the environment already sets it. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/guilded-fontconfig</cachedir>
</fontconfig>
