name: Guilded mobile OTA update
# Publishes JavaScript-only changes to the Android preview channel. Manual only (Run workflow) until the owner
# approves publishing updates on every change to mobile/. It does nothing until the repository has an EXPO_TOKEN
# secret. It never builds an APK. The eas-cli version is pinned: raise it in a reviewed change.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for the Expo token
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; echo "EXPO_TOKEN is not set; skipping the mobile update."; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
      - run: npm run typecheck
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
      - run: npx --no-install expo install --check
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
      # --auto uses the commit message. Native or dependency changes need a new APK and a mobile version bump.
      - run: npx eas-cli@27.10.0 update --channel preview --environment preview --platform android --non-interactive --auto
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
