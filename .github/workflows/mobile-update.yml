name: Guilded mobile OTA update
# Publishes JavaScript-only changes to the Android preview channel when mobile/ changes on main.
# It does nothing until the repository has an EXPO_TOKEN secret. It never builds an APK.
on:
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for the Expo token
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; echo "EXPO_TOKEN is not set; skipping the mobile update."; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
      - run: npm run typecheck
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
      - run: npx --no-install expo install --check
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
      # --auto uses the commit message. Native or dependency changes need a new APK and a mobile version bump.
      - run: npx eas-cli@latest update --channel preview --environment preview --platform android --non-interactive --auto
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
